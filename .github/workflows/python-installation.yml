name: Installing Python

'on': 
  push: 

jobs:
  build:
    runs-on: '${{  matrix.os  }}'

    strategy: 
      matrix:
        python-version: [3.10, 3.11, 3.12]
        os: [ubuntu-latest, macos-14, windows-latest]
    
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '${{  matrix.python-version  }}'
