name: Installing Python

on: push

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, mac-14, windows-lates]
        py-version: [3.10, 3.11, 3.12]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        python-version: ${matrix.py-version}
        
